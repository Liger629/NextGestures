name: Build (artifact only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
      runs-on: windows-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'

        - name: Setup Rust
          uses: dtolnay/rust-toolchain@stable

        - name: Cache Rust build
          uses: Swatinem/rust-cache@v2
          with:
            workspaces: '. -> target'

        - name: Install deps
          run: npm ci

        - name: Disable updater signing (artifact-only build)
          shell: pwsh
          run: |
            $p = 'src-tauri/tauri.conf.json'
            (Get-Content $p -Raw) `
              -replace '"createUpdaterArtifacts":\s*true', '"createUpdaterArtifacts": false' `
              | Set-Content $p -NoNewline

        - name: Build NextGestures
          run: npm run tauri build

        - name: List release exes (debug)
          shell: pwsh
          run: |
            Write-Host "--- top-level .exe in target/release ---"
            Get-ChildItem -Path src-tauri/target/release -Filter *.exe -File |
              Where-Object { $_.DirectoryName -match 'release$' } |
              Select-Object Name, Length | Format-Table -AutoSize

        - name: Upload green exe
          uses: actions/upload-artifact@v4
          with:
            name: NextGestures-portable-exe
            path: |
              src-tauri/target/release/NextGestures.exe
              src-tauri/target/release/next-gestures.exe
            if-no-files-found: error

        - name: Upload NSIS installer
          uses: actions/upload-artifact@v4
          with:
            name: NextGestures-setup-exe
            path: src-tauri/target/release/bundle/nsis/*.exe
            if-no-files-found: warn
